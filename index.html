<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citrino 2027 - Gestão de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfbf7; }
        .chart-container { position: relative; width: 100%; max-width: 500px; margin: auto; height: 300px; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(231, 229, 228, 0.5); }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 1.5rem; background-color: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <nav class="sticky top-0 z-50 glass-effect">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center shadow-lg"><span class="text-white font-bold">C</span></div>
                <h1 class="font-extrabold text-lg tracking-tight">CITRINO <span class="text-amber-600">2027</span></h1>
            </div>
            <button onclick="toggleCart()" class="relative p-3 bg-slate-900 text-white rounded-xl shadow-xl">
                <span id="cartCount" class="absolute -top-2 -right-2 bg-amber-500 text-slate-900 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
                🛒
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <section id="stats" class="mb-12 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-4 text-center">Mix de Produtos</h3>
                <div class="chart-container"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-center">
                <h2 class="text-2xl font-black mb-2">Catálogo Digital <span class="text-amber-500">B2B</span></h2>
                <p class="text-slate-500 text-sm mb-6">Selecione os produtos abaixo para gerar seu orçamento automático. O estoque é atualizado em tempo real pela nossa central.</p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-amber-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-bold text-amber-600 uppercase">Itens Disponíveis</p>
                        <p id="totalAvailable" class="text-xl font-black text-slate-900">0</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Em Falta</p>
                        <p id="totalOutOfStock" class="text-xl font-black text-slate-900">0</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="catalog">
            <div class="flex flex-col md:flex-row justify-between gap-4 mb-8">
                <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar" id="filterTabs"></div>
                <input type="text" id="searchInput" oninput="filterData()" placeholder="Buscar por REF ou Nome..." class="bg-white border border-slate-200 px-6 py-3 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-amber-500 w-full md:w-64 shadow-sm">
            </div>

            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>
    </main>

    <div id="cartDrawer" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl z-[60] transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="font-black text-xl">Meu Pedido</h2>
            <button onclick="toggleCart()" class="text-2xl">✕</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 bg-slate-50 border-t">
            <div class="flex justify-between items-center mb-6">
                <span class="font-bold text-slate-500">TOTAL</span>
                <span id="cartTotal" class="text-2xl font-black">R$ 0,00</span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-emerald-700 transition">Enviar para WhatsApp</button>
        </div>
    </div>

    <script>
        // --- ÁREA DE EDIÇÃO DO ESTOQUE E FOTOS ---
        const catalog = [
            { id: 1, ref: "RB27420", desc: "Mochila Rodinhas Rebecca Bonbon", category: "JUVENIL", price: 379.90, stock: 15, img: "https://via.placeholder.com/400x400?text=RB27420" },
            { id: 2, ref: "RB27005", desc: "Mochila Costas Rebecca Bonbon", category: "JUVENIL", price: 179.90, stock: 42, img: "https://via.placeholder.com/400x400?text=RB27005" },
            { id: 3, ref: "CP26263B", desc: "KIT BABY: Mochila + Lancheira", category: "BABY", price: 114.90, stock: 0, img: "https://via.placeholder.com/400x400?text=CP26263B" },
            { id: 4, ref: "ML1306", desc: "Mochila Executiva Notebook", category: "EXECUTIVO", price: 249.90, stock: 8, img: "https://via.placeholder.com/400x400?text=ML1306" },
            { id: 5, ref: "SA3483", desc: "Mala Sacola Extra Grande", category: "VIAGEM", price: 69.90, stock: 20, img: "https://via.placeholder.com/400x400?text=SA3483" }
        ];

        let cart = [];
        let currentCat = 'TODOS';

        function init() {
            renderFilters();
            filterData();
            updateStats();
            renderCharts();
        }

        function renderFilters() {
            const cats = ['TODOS', ...new Set(catalog.map(p => p.category))];
            document.getElementById('filterTabs').innerHTML = cats.map(c => `
                <button onclick="setCategory('${c}')" class="px-5 py-2 rounded-full text-xs font-bold transition-all whitespace-nowrap ${currentCat === c ? 'bg-amber-500 text-white shadow-md' : 'bg-white border text-slate-500'}">${c}</button>
            `).join('');
        }

        function setCategory(c) { currentCat = c; renderFilters(); filterData(); }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = catalog.filter(p => (currentCat === 'TODOS' || p.category === currentCat) && (p.ref.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query)));
            renderProducts(filtered);
        }

        function renderProducts(data) {
            document.getElementById('productGrid').innerHTML = data.map(p => `
                <div class="bg-white rounded-[2rem] p-4 border border-slate-100 shadow-sm relative ${p.stock === 0 ? 'opacity-60' : ''}">
                    <img src="${p.img}" alt="${p.desc}" class="product-img mb-4">
                    ${p.stock === 0 ? '<span class="absolute top-8 left-8 bg-red-500 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase">Esgotado</span>' : ''}
                    <div class="px-2">
                        <p class="text-[10px] font-mono text-slate-400 font-bold mb-1">REF: ${p.ref}</p>
                        <h3 class="font-bold text-sm text-slate-800 h-10 line-clamp-2 leading-tight mb-3">${p.desc}</h3>
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase font-bold">Atacado</p>
                                <p class="text-lg font-black text-slate-900">R$ ${p.price.toFixed(2).replace('.', ',')}</p>
                            </div>
                            <button onclick="addToCart(${p.id})" ${p.stock === 0 ? 'disabled' : ''} class="w-10 h-10 ${p.stock === 0 ? 'bg-slate-200' : 'bg-amber-500 hover:bg-slate-900'} text-white rounded-xl flex items-center justify-center transition shadow-lg">
                                ${p.stock === 0 ? '✕' : '+'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalAvailable').innerText = catalog.filter(p => p.stock > 0).length;
            document.getElementById('totalOutOfStock').innerText = catalog.filter(p => p.stock === 0).length;
        }

        function toggleCart() { document.getElementById('cartDrawer').classList.toggle('translate-x-full'); }

        function addToCart(id) {
            const prod = catalog.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if(item) {
                if(item.qty < prod.stock) item.qty++;
                else alert('Limite de estoque atingido.');
            } else {
                cart.push({...prod, qty: 1});
            }
            updateCartUI();
        }

        function updateCartUI() {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cartTotal').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('cartItems').innerHTML = cart.map(i => `
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border">
                    <img src="${i.img}" class="w-12 h-12 rounded-lg object-cover">
                    <div class="flex-1">
                        <p class="text-[10px] font-bold text-slate-800 line-clamp-1">${i.desc}</p>
                        <p class="text-xs font-black">R$ ${i.price.toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${i.id}, -1)" class="w-6 h-6 bg-white border rounded text-xs">-</button>
                        <span class="text-xs font-bold">${i.qty}</span>
                        <button onclick="changeQty(${i.id}, 1)" class="w-6 h-6 bg-white border rounded text-xs">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            const prod = catalog.find(p => p.id === id);
            item.qty += delta;
            if(item.qty > prod.stock) { item.qty = prod.stock; alert('Estoque máximo atingido'); }
            if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function sendOrder() {
            if(cart.length === 0) return;
            let msg = "*ORÇAMENTO CITRINO 2027*\n\n";
            cart.forEach(i => msg += `📦 *${i.ref}* - ${i.desc}\nQtd: ${i.qty} x R$ ${i.price.toFixed(2)}\n\n`);
            msg += `*TOTAL ESTIMADO: ${document.getElementById('cartTotal').innerText}*`;
            window.open(`https://wa.me/5599985574488?text=${encodeURIComponent(msg)}`);
        }

        function renderCharts() {
            const catData = {};
            catalog.forEach(p => catData[p.category] = (catData[p.category] || 0) + 1);
            new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catData),
                    datasets: [{ data: Object.values(catData), backgroundColor: ['#f59e0b', '#0f172a', '#64748b', '#cbd5e1'], borderWidth: 0 }]
                },
                options: { maintainAspectRatio: false, cutout: '80%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10, weight: 'bold' } } } } }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
